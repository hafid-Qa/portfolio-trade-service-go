version: "2"

sql:
  - engine: "postgresql"
    schema: "internal/sqlc/migrations/"
    queries: "internal/sqlc/query/"
    gen:
      go:
        out: "internal/sqlc/"
        package: "sqlc"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
