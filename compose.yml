name: portfolio-trade-service
x-backend: &backend
  build:
    context: .
    dockerfile: apps/exec-api/Dockerfile
  image: backend:latest
services:
  api:
    <<: *backend
    container_name: api
    volumes:
      - ./apps/exec-api:/app:rw
      - ./data:/data:rw
    working_dir: /app
    ports:
      - ${API_EXT_PORT}:${API_INT_PORT}
    env_file: .env
    environment:
      CALC_ADDR: calc:${CALC_GRPC_PORT}
    entrypoint: ["/scripts/entrypoint.sh"]
    command: ["air", "-c", ".air.toml"]
    depends_on:
      calc:
        condition: service_started
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 100
      start_period: 60s
  calc:
    build:
      context: .
      dockerfile: apps/calc/Dockerfile
    image: calc:latest
    container_name: calc
    volumes:
      - ./apps/calc:/app:rw
    working_dir: /app
    ports:
      - ${CALC_GRPC_EXT_PORT}:${CALC_GRPC_PORT}
    env_file: .env
    command: ["go", "run", "./cmd"]

  db:
    container_name: db
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD? Variable not set}
      - POSTGRES_USER=${DB_USERNAME? Variable not set}
      - POSTGRES_DB=${DB_NAME? Variable not set}
      - PGPORT=${DB_PORT? Variable not set}
    volumes:
      - ${DB_DATA? Variable not set}:/var/lib/postgresql/data:rw
    networks:
      - default
    ports:
      - ${DB_EXT_PORT? Variable not set}:${DB_PORT? Variable not set}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p $${PGPORT} || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 100
      start_period: 10s

  broker:
    container_name: ${BROKER_HOST? Variable not set}
    image: redis/redis-stack-server:latest
    restart: always
    environment:
      - REDIS_ARGS="--requirepass ${BROKER_PASSWORD? Variable not set}"
    volumes:
      - ${REDIS_VOLUME? Variable not set}:/data:rw
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 100
      start_period: 5s

  consumer:
    <<: *backend
    container_name: consumer
    env_file: .env
    depends_on:
      broker:
        condition: service_healthy
      db:
        condition: service_healthy
    command: ["go", "run", "./cmd/worker"]

networks:
  default:
    name: portfolio-trade-service
