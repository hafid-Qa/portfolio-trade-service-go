name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: make test
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - run: cd proto && go vet ./... && go build ./...
