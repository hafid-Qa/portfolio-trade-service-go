name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      # app/docs is gitignored (generated by swag on every container start, same
      # as entrypoint.sh does) -- a fresh checkout doesn't have it, and main.go
      # imports it unconditionally, so it has to be generated before vet/test.
      - run: GOFLAGS=-mod=mod go run github.com/swaggo/swag/cmd/swag@v1.8.12 init -g cmd/server/main.go -o ./docs --parseInternal
      - run: go vet ./...
      - run: go test ./...
