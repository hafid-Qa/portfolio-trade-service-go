name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: make test
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l apps proto)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - run: cd proto && go vet ./... && go build ./...
