name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose run --rm exec-api sh -c "go vet ./... && go test ./..."
      - run: docker compose run --rm calc sh -c "go vet ./... && go test ./..."
