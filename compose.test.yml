services:
  api:
    depends_on:
      db_test:
        condition: service_healthy

  db_test:
    container_name: db_test
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD? Variable not set}
      - POSTGRES_USER=${DB_USERNAME? Variable not set}
      - POSTGRES_DB=${DB_NAME? Variable not set}
      - PGPORT=${DB_PORT? Variable not set}
    networks:
      - default
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p $${PGPORT} || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 100
      start_period: 10s
